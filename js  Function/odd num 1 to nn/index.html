<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>odd num</title>
</head>

<body>
    <script>
        //wap to print 1 to n using do..while loop 

        function num(n) {
            let i = 1;

            do {
                if (i % 2 == 1) {
                    console.log(i);
                }
                i++;
            }
            while (i <= n);
        }

        num(30);
    </script>
</body>

</html>
