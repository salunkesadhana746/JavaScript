<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reverse array</title>
</head>
<body>
    <script>
        //wap to print array in reverse order in  function

        function reverse(arr){
            for(let i = arr.length - 1; i>=0; i--){
                console.log(arr[i]);
            }
        
        }
        reverse([20, 30, 50, 18]);
        reverse([2, 20, 55, 28]);
       
    </script>
</body>
</html>
