<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>relational operators</title>
</head>

<body>
    <script>
        function operators(a, b) {
            //equal to (==)
            console.log("a == b = " + a == b);
            //not equal to (==)
            console.log("a != b = " + a != b);
            //greater than (>)
            console.log("a > b = " + a > b);
            // Greater than or equal (>=)
            console.log("a >= b = " + a >= b);
            //less than (<)
            console.log("a < b = " + a < b);
            //less than equal to (<=)
            console.log("a < b = " + a <= b);

        }

        operators(20, 30);
        operators(22, 58);
    </script>
</body>

</html>
