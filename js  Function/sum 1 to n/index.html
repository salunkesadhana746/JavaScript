<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sum 1 to n</title>
</head>
<body>
    <script>
        function sum(n){
            let sum = (n* (n + 1)) / 2;

            console.log("sum 1 to n = "+sum);
        }
        sum(5);
        sum(10);
    </script>
</body>
</html>
