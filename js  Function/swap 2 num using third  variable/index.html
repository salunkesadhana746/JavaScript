<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>third variable</title>
</head>
<body>
    <script>
        // swap two num using third variable
        
        function swaping(x, y){
            let  z = x;
            x = y;
            y = z;

            console.log ("x = "+x);
            console.log ("y = "+y);
        }

        swaping(10, 20);
    </script>
</body>
</html>
