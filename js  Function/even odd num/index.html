<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>even odd num</title>
</head>

<body>
    <script>
        // wap to check number is even or odd using if..else stastment 

        function evenOddnum(num){
            if(num % 2 == 0){
                console.log("number is even !");
            }
            else{
                console.log("number is odd !");
            }
        }

        evenOddnum(8);
        evenOddnum(3); 
        evenOddnum(79); 
    </script>
</body>

</html>
