<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>even num 10 to 1</title>
</head>

<body>
    <script>
        //wap to print only even numbers from 10 to 1.

        function even(i) {
            do {
                if (i % 2 == 0) {
                    console.log(i);
                }
                i--;
            }
            while (i >= 1);
        }

        even(10);
    </script>
</body>

</html>
