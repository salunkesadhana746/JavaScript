<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>magic number</title>
</head>

<body>
    <script>
        //wap to check number is magic or not.
        function magicnum(num) {
            let sum = 0;
            let mul = 1;

            while (num > 0) {
                let digit = num % 10;
                sum += digit;
                mul *= digit;
                num = Math.floor(num / 10);
            }

            if (sum == mul) {
                console.log("This number is magic.");
            }
            else {
                console.log("This number is not magic.");
            }
        }

        magicnum(123);
    </script>
</body>

</html>
