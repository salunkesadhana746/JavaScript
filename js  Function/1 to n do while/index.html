<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 to n print</title>
</head>

<body>
    <script>
        //wap to print 1 to n using do..while loop 
        function num(n) {
            let i = 1;
            do {
                console.log(i);
                i++;
            }
            while (i <= n);
        }
        num(20);
        num(5);
    </script>
</body>

</html>
