<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 to 1</title>
</head>

<body>
    <script>
        function print(i) {
            do {
                console.log(i);
                i--;
            }
            while (i >= 1);
        }

        print(20);
        print(5);
    </script>
</body>

</html>
