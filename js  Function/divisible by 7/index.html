<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>divisible by 7</title>
</head>

<body>
    <script>
        //wap to check if a number is divisible by 7 using function
        function divisiable(num) {
            if (num % 7 == 0) (
                console.log("number is divisible by 7")
            )
            else {
                console.log("number is not divisible by 7");

            }
        }

        divisiable(54);
        divisiable(21);
        divisiable(94);
    </script>
</body>

</html>
