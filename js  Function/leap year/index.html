<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leap year</title>
</head>

<body>
    <script>
        //wap to print leap years from 2000 to 3000.

        function year(s) {
            do {
                console.log(s)
                s += 4;
            }
            while (s <= 3000);
        }
        year(2000);
    </script>
</body>

</html>
