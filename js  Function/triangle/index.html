<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>triangle</title>
</head>
<body>
    <script>
        function triangle(base, height) {
            let area_of_triangle = 0.5 * base * height;
            console.log("area of triangle = "+ area_of_triangle);
        }
        
        triangle(7,5);
        triangle(2,6);
    </script>
</body>
