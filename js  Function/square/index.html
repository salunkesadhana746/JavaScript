<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>square</title>
</head>

<body>
    <script>
        // find area of square 

        function square(square){
            let area_of_square = square * square;

            console.log("area of square = "+ area_of_square);
        }

        square(4);
        square(9);
    </script>
</body>
