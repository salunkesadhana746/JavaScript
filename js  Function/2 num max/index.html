<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 num max</title>
</head>

<body>
    <script>
        //wap to max find from 2 variable using else if ladder.

        function maxnum(a, b) {
            if (a > b) {
                console.log(" a is max");
            }
            else {
                console.log(" b is max");
            }
        }

        maxnum(20, 5);
        maxnum(33, 55);
    </script>
</body>

</html>
