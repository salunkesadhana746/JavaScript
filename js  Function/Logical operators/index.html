<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logical operators</title>
</head>

<body>
    <script>
        function logical(a, b, c) {
            console.log(a > b && b > c);
            console.log(a > b || b < c);
            console.log(!(a < b));
        }

        logical(20, 30, 40);
        logical(40, 30, 20);
    </script>
</body>

</html>
