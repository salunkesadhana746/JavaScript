<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fun area of circle</title>
</head>

<body>
    <script>
        // find area of circle

        function circle(circle) {
            const pi = 3.14;
            let area_of_circle = pi * circle * circle;
            console.log("area of circle = " + area_of_circle);

        }
        circle(5);

        
    </script>
</body>

</html>
