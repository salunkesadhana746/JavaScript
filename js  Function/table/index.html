<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <script>
        //wap to find multiplication table of any num 

        function table(num){
            for(let i = 1; i <= 10; i++){
                console.log(num + " X " + i + " = " + (num *i));
            }
        }

        table(5);
    </script>
</body>
</html>
