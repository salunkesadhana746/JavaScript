<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>negitive, positive, neutral</title>
</head>

<body>
    <script>
        //wap to check number is negitive, positive, neutral

        function check(num) {
            if (num > 0) {
                console.log("number is positive !");
            }
            else if (num == 0) {
                console.log("number is neutral !");
            }
            else {
                console.log("number is negitive !");
            }
        }

        check(18);
        check(0);
        check(-18);
    </script>
</body>

</html>
