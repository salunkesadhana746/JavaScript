<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>num + - 0</title>
</head>

<body>
    <script>
        // wap to check num is +,-,0 using nested if else
        function check(num) {
            if (num > 0) {
                console.log(num + " num is positive !");
            }
            else {
                if (num < 0) {
                    console.log(num + " num is negitive !");
                }
                else {
                    console.log(num + " num is neutral !");
                }
            }
        }

        check(10);
        check(0);
        check(-10);
    </script>
</body>

</html>
