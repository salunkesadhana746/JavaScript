<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <section class="container-fluid">
        <h1 class="text-center my-4">kaun banega karodpati</h1>
        <div class="container text-center">
            <button id="start-btn" class="btn btn-primary ">Start Quiz</button>
        </div>
        <div id="quiz-container" class="container d-none">
            <div class="d-flex justify-content-center">
                <h2 id="timer-count" class="border border-black border-3 p-3 rounded"></h2>
            </div>
            <div class="container">
                <p>
                    <span id="question-index">Q.1</span>
                    <span id="question">Lorem ipsum dolor sit amet consectetur adipisicing elit?</span>
                </p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="option-a-btn" value="0" />
                    <label id="option-a-text" class="form-check-label" for="radioDefault1">
                        Default radio
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="option-b-btn" value="1" />
                    <label id="option-b-text" class="form-check-label" for="radioDefault1">
                        Default radio
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="option-c-btn" value="2" />
                    <label id="option-c-text" class="form-check-label" for="radioDefault1">
                        Default radio
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="radioDefault" id="option-d-btn" value="3" />
                    <label id="option-d-text" class="form-check-label" for="radioDefault1">
                        Default radio
                    </label>
                </div>
                <div id="quiz-container" class="container d-none">
                    <div class="d-flex justify-content-center">
                        <h2 id="timer-count" class="border border-danger border-3 p-3 rounded"></h2>
                    </div>
                </div>
                <div class="my-3">
                    <button id="next-question-btn" class="btn btn-primary">Next</button>
                </div>
            </div>
            <div id="quiz-result" class="d-none">
                <h2 id="quiz-mark" class="text-center">5/10</h2>
                <p id="quiz-status" class="text-center">Lorem ipsum dolor sit amet.</p>
            </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>

</html>
