<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <section class="container-fluid">

        <h1 class="text-center my-4">
            Kaun Banega Karodpati
        </h1>

        <div class="container text-center">
            <button id="start-btn" class="btn btn-primary">
                Start Quiz
            </button>
        </div>

        <div id="quiz-container" class="container d-none">

            <div class="d-flex justify-content-center mb-4">
                <h2 id="timer-count" class="border border-black border-3 p-3 rounded"></h2>
            </div>

            <div class="container">
                <p class="fs-5">
                    <span id="question-index">Q-1</span>
                    <span id="question">
                        Question will appear here
                    </span>
                </p>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="quiz-option" id="option-a-btn" value="0">
                    <label id="option-a-text" class="form-check-label" for="option-a-btn">
                        Option A
                    </label>
                </div>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="quiz-option" id="option-b-btn" value="1">
                    <label id="option-b-text" class="form-check-label" for="option-b-btn">
                        Option B
                    </label>
                </div>

                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="quiz-option" id="option-c-btn" value="2">
                    <label id="option-c-text" class="form-check-label" for="option-c-btn">
                        Option C
                    </label>
                </div>

                <div class="form-check mb-2">

                    <input class="form-check-input" type="radio" name="quiz-option" id="option-d-btn" value="3">
                    <label id="option-d-text" class="form-check-label" for="option-d-btn">
                        Option D
                    </label>
                </div>

                <div class="my-3">
                    <button id="next-question-btn" class="btn btn-primary">
                        Next
                    </button>
                </div>
            </div>
        </div>

        <div id="quiz-result" class="container my-4 d-none">
            <h2 id="quiz-mark" class="text-center">0/10</h2>
            <p id="quiz-status" class="text-center fs-4">
                Result
            </p>

            <div class="text-center">

                <button id="restart-btn" class="btn btn-success">
                    Restart Quiz
                </button>
            </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="script.js"></script>
</body>

</html>
