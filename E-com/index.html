<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>e-commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container-fluid">
        <div class="container">

            <h2 class="fst-italic">Products List</h2>
            <h3 class="text-center">Add Product Details</h3>

            <div class="d-flex flex-column gap-3 m-3 bg-light p-3 text-black">
                <input type="text" class="form-control" placeholder="Product Name..." id="input-product-name">
                <input type="text" class="form-control" placeholder="Product URL..." id="input-product-url">
                <input type="text" class="form-control" placeholder="Product description..."
                    id="input-product-description">
                <input type="text" class="form-control" placeholder="Product Price..." id="input-product-price">
                <input type="text" class="form-control" placeholder="Product Discount..." id="input-product-discount">
                <input type="text" class="form-control" placeholder="Product Category..." id="input-product-category">
                <input type="text" class="form-control" placeholder="Product Rating..." id="input-product-rating">
                <button class="btn btn-primary" id="add-btn">Add Product</button>
                <button class="btn btn-warning d-none" id="edit-btn">Edit Product</button>
            </div>
        </div>
        <hr>
        <div class="container my-5 d-flex text-center gap-3">
            <div class="d-flex gap-3 col-5">
                <input type="text" placeholder="Search here..." class="form-control" id="input-search" />
                <button class="btn btn-primary" id="search-btn">Search</button>
            </div>

            <div class="dropdown">
                <a class="form-control dropdown-toggle border border-1 border-secondary px-5 py-2 rounded text-decoration-none text-muted"
                    href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    All Products
                </a>

                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Food</a></li>
                    <li><a class="dropdown-item" href="#">Clothes</a></li>
                    <li><a class="dropdown-item" href="#">Beauty</a></li>
                    <li><a class="dropdown-item" href="#">Electronics</a></li>
                    <li><a class="dropdown-item" href="#">Jewelry</a></li>
                    <li><a class="dropdown-item" href="#">Kitchen</a></li>
                </ul>
            </div>
            <select class="p-2 rounded" name="" id="price-filter">
                <option value="default">Default</option>
                <option value="max">Higher to Lower</option>
                <option value="min">Lower to Higher</option>
            </select>

        </div>

        <div class="container">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Preview</th>
                        <th scope="col">Product Name</th>
                        <th scope="col">Category</th>
                        <th scope="col">Description</th>
                        <th scope="col">Price</th>
                        <th scope="col">Discount</th>
                        <th scope="col">Rating</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody id="product-tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script src="script.js"></script>
</body>

</html>
