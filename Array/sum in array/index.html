<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sun of all elements</title>
</head>
<body>
    <script>
        //wap to find sum of all elements of array using loop

        const arr = [10, 20, 30, 40, 50, 66];
        let sum = 0;

        for(let i = 0; i < arr.length; i++){
            sum = sum + arr[i];
        }
        console.log("sum of all elements of array = "+sum);
    </script>
</body>
</html>
