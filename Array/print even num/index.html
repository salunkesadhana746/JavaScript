<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>print even num</title>
</head>
<body>
    <script>
        // wap to print only even number in array
        const arr = [1, 2, 3, 4, 5, 6, 7, 8];

        for(let i=0; i < arr.length; i++){
            if(arr[i] % 2 == 0){
                console.log(arr[i]);
            }
        }
    </script>
</body>
</html>
