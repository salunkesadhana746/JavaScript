<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reverse array</title>
</head>
<body>
    <script>
        //wap to print array in reverse order using loop

        const arr = [10, 20, 2, 6, 8];
        console.log("befor array in reverse = "+arr);

        for(let i = arr.length-1; i >= 0; i--){
            console.log("after array in reverse = "+i);
        }
    </script>
</body>
</html>
