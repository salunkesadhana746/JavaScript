<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>min num of array</title>
</head>
<body>
    <script>
        const arr = [20,58,1,59,75,95,5,55];

        let min = arr[0];

        arr.forEach((e)=>{
            if(min > e){
                min = e;
            }
        });

        console.log("min num of array = " + min);

    </script>
</body>
</html>
