<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form">
            <input id="input-name" type="text" placeholder="Enter Your Name"/>
            <input id="input-email" type="email" placeholder="Enter your Email"/>
            <input id="input-phone" type="number" placeholder="Enter Phone">
            <input id="input-age" type="number" placeholder="Enter your Age">
            <button id="submit-btn">submit</button>

            <p id="output-name"></p>
            <p id="output-email"></p>
            <p id="output-phone"></p>
            <p id="output-age"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
